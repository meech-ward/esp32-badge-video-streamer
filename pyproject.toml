[project]
name = "esp32-badge-video-streamer"
version = "0.1.0"
description = "ESP32-S3 camera streaming to native or stock Badgeware viewers"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=8,<10", "pillow>=10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests", "native/tests"]
pythonpath = [".", "tufty/video_streamer"]
