[project]
name = "esp32-badge-video-streamer"
version = "0.1.0"
description = "Direct ESP32-S3 camera video streaming to stock Tufty Badgeware"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tufty/video_streamer"]
